[changelog]
header = ""
footer = ""
trim = true
body = """
{%- set parts = version | split(pat="-v") -%}
## VirtuMic {{ parts.0 | capitalize }} {{ parts.1 }} | {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group }}
{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }} - ({{ commit.id | truncate(length=7, end="") }})
{% endfor -%}
{% endfor -%}
"""

[git]
conventional_commits = true
filter_unconventional = true
ignore_merge_commits = true
filter_commits = true
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat\\(security\\):", group = "Security" },
    { message = "^fix\\(security\\):", group = "Security" },
    { message = "^feat(\\(.*\\))?:.*deprecat", group = "Deprecated" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = " Documentation" },
    { message = "^revert", skip = true},
    { message = "^style", skip = true },
    { message = "^chore", skip = true },
    { message = "^refactor", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
]

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
