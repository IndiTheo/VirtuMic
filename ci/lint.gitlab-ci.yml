---

.lint_changes: &lint_changes
  - src/**/*
  - tools/lint/*
  - "**/{BUILD,BUILD.bazel}"
  - "**/MODULE.bazel"

code_lint:
  extends: .bazel_cache
  stage: lint
  image: $CI_BASE_IMAGE
  variables:
    BAZEL_CACHE_POLICY: "pull"
  script:
    - eval "$(mise activate bash --quiet)"
    - bazel run --config=ci //:lint
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *lint_changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *lint_changes

commit_lint:
  stage: lint
  image: node:alpine
  cache:
    key:
      files:
        - ci/commitlint.config.js
      prefix: npm-commitlint
    paths:
      - ~/.npm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm install -g @commitlint/cli @commitlint/config-conventional
  script:
    - echo "${CI_MERGE_REQUEST_TITLE}" | commitlint --config ci/commitlint.config.js
