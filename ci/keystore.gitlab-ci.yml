# Run once via GitLab Web UI (Pipelines -> Run pipeline) to generate and store the release keystore
setup_keystore:
  stage: infra
  image: $CI_BASE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  script:
    - eval "$(mise activate bash --quiet)"
    - |
      [ -n "${GITLAB_API_TOKEN:-}" ] || { echo "ERROR: GITLAB_API_TOKEN (with api scope) must be set first."; exit 1; }

      BASE_KEYS_PRESENT=0
      BASE_KEYS_TOTAL=4
      [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && BASE_KEYS_PRESENT=$((BASE_KEYS_PRESENT + 1))
      [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && BASE_KEYS_PRESENT=$((BASE_KEYS_PRESENT + 1))
      [ -n "${ANDROID_KEY_ALIAS:-}" ] && BASE_KEYS_PRESENT=$((BASE_KEYS_PRESENT + 1))
      [ -n "${ANDROID_KEY_PASSWORD:-}" ] && BASE_KEYS_PRESENT=$((BASE_KEYS_PRESENT + 1))

      DERIVED_KEYS_MISSING=0
      if [ -z "${ANDROID_PUBLIC_CERT_PEM:-}" ] || [ -z "${ANDROID_CERT_SHA256:-}" ]; then
        DERIVED_KEYS_MISSING=1
      fi

      if [ $BASE_KEYS_PRESENT -gt 0 ] && [ $BASE_KEYS_PRESENT -lt $BASE_KEYS_TOTAL ]; then
        echo "ERROR: Partial base keys detected ($BASE_KEYS_PRESENT/$BASE_KEYS_TOTAL present). Aborting to prevent inconsistency."
        exit 1
      fi

      if [ $BASE_KEYS_PRESENT -eq $BASE_KEYS_TOTAL ] && [ $DERIVED_KEYS_MISSING -eq 0 ]; then
        echo "CANCELLED: All base keys and derived fingerprints already exist. Nothing to do."
        exit 0
      fi

      if [ $BASE_KEYS_PRESENT -eq $BASE_KEYS_TOTAL ] && [ $DERIVED_KEYS_MISSING -eq 1 ]; then
        echo "INFO: All base keys are present, but derived keys are missing. Generating and publishing derived keys from existing base keystore..."
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
        PUBLIC_CERT_PEM=$(keytool -exportcert -rfc -keystore /tmp/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")
        CERT_SHA256=$(echo "$PUBLIC_CERT_PEM" | openssl x509 -noout -fingerprint -sha256 | sed 's/SHA256 Fingerprint=//')

        echo "=========================================="
        echo "APK Signing Certificate SHA-256 Fingerprint:"
        echo "$CERT_SHA256"
        echo "=========================================="

        curl --fail --silent --show-error \
          --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          --form "key=ANDROID_PUBLIC_CERT_PEM" --form "value=${PUBLIC_CERT_PEM}" --form "protected=true" --form "masked_and_hidden=false" || true

        curl --fail --silent --show-error \
          --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          --form "key=ANDROID_CERT_SHA256" --form "value=${CERT_SHA256}" --form "protected=true" --form "masked_and_hidden=false" || true

        rm -f /tmp/release.keystore
        echo "SUCCESS: Derived keys generated and published successfully from existing base keys."
        exit 0
      fi

      echo "Generating 4096-bit RSA Release Keystore (PKCS12)..."
      KEYSTORE_PASS=$(openssl rand -hex 24)
      KEY_PASS="$KEYSTORE_PASS"
      KEY_ALIAS="virtumic"

      keytool -genkeypair -v \
        -keystore /tmp/release.keystore \
        -storetype PKCS12 \
        -keyalg RSA \
        -keysize 4096 \
        -validity 15000 \
        -alias "$KEY_ALIAS" \
        -storepass "$KEYSTORE_PASS" \
        -keypass "$KEY_PASS" \
        -dname "CN=IndiDevs, O=VirtuMic"

      KEYSTORE_B64=$(base64 -w 0 /tmp/release.keystore)
      PUBLIC_CERT_PEM=$(keytool -exportcert -rfc -keystore /tmp/release.keystore -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS")
      CERT_SHA256=$(echo "$PUBLIC_CERT_PEM" | openssl x509 -noout -fingerprint -sha256 | sed 's/SHA256 Fingerprint=//')

      echo "=========================================="
      echo "APK Signing Certificate SHA-256 Fingerprint:"
      echo "$CERT_SHA256"
      echo "=========================================="

      echo "Persisting keystore variables to GitLab CI/CD Settings..."

      curl --fail --silent --show-error \
        --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --form "key=ANDROID_KEYSTORE_BASE64" --form "value=${KEYSTORE_B64}" --form "protected=true" --form "masked_and_hidden=false" || true

      curl --fail --silent --show-error \
        --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --form "key=ANDROID_KEYSTORE_PASSWORD" --form "value=${KEYSTORE_PASS}" --form "protected=true" --form "masked_and_hidden=true" || true

      curl --fail --silent --show-error \
        --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --form "key=ANDROID_KEY_ALIAS" --form "value=${KEY_ALIAS}" --form "protected=true" --form "masked_and_hidden=false" || true

      curl --fail --silent --show-error \
        --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --form "key=ANDROID_KEY_PASSWORD" --form "value=${KEY_PASS}" --form "protected=true" --form "masked_and_hidden=true" || true

      curl --fail --silent --show-error \
        --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --form "key=ANDROID_PUBLIC_CERT_PEM" --form "value=${PUBLIC_CERT_PEM}" --form "protected=true" --form "masked_and_hidden=false" || true

      curl --fail --silent --show-error \
        --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --form "key=ANDROID_CERT_SHA256" --form "value=${CERT_SHA256}" --form "protected=true" --form "masked_and_hidden=false" || true

      echo "Release keystore generated and persisted successfully!"
  after_script:
    - rm -f /tmp/release.keystore
