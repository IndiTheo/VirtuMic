.cliff_resolve:
  script:
    - |
      CLIFF_ARGS=(--config ci/cliff.toml --include-path "virtumic-${COMPONENT}/**" --tag-pattern "${COMPONENT}-v[0-9]*")
      if [ -z "$(git tag -l "${COMPONENT}-v*")" ]; then
        TAG_NAME="${COMPONENT}-v0.1.0"
        [ -n "${PRE_RELEASE:-}" ] && TAG_NAME="${TAG_NAME}-${PRE_RELEASE}.0"
      else
        BUMPED=$(git-cliff "${CLIFF_ARGS[@]}" --bumped-version)
        if [ -n "${PRE_RELEASE:-}" ]; then
          CLEAN_BUMPED="${BUMPED%%-${PRE_RELEASE}*}"
          COUNT=$(git tag -l "${CLEAN_BUMPED}-${PRE_RELEASE}.*" | wc -l)
          TAG_NAME="${CLEAN_BUMPED}-${PRE_RELEASE}.$((COUNT + 1))"
        else
          TAG_NAME="$BUMPED"
        fi
      fi
      NEXT_VERSION="${TAG_NAME#"${COMPONENT}-v"}"
      DESCRIPTION=$(git-cliff "${CLIFF_ARGS[@]}" --unreleased --tag "$TAG_NAME")

      if [ -z "$DESCRIPTION" ]; then
        echo "ERROR: No unreleased changes found for $TAG_NAME ($COMPONENT)." >&2
        exit 1
      fi

      mkdir -p dist
      printf '%s\n' "$DESCRIPTION" > dist/release_notes.md
      echo "TAG_NAME=$TAG_NAME" > release.env
      echo "NEXT_VERSION=$NEXT_VERSION" >> release.env

      export TAG_NAME NEXT_VERSION DESCRIPTION
