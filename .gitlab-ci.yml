---
include:
  - local: 'ci/keystore.gitlab-ci.yml'
  - local: 'ci/gpg.gitlab-ci.yml'
  - local: 'ci/build_ci_base_image.gitlab-ci.yml'
  - local: 'ci/lint.gitlab-ci.yml'
  - local: 'ci/sign.gitlab-ci.yml'
  - local: 'ci/release-metadata.gitlab-ci.yml'

variables:
  CI_BASE_IMAGE: "$CI_REGISTRY_IMAGE:latest"
  CI_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE/release:latest"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^app-v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$/
    - if: $CI_COMMIT_TAG =~ /^core-v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$/
    - if: $CI_COMMIT_TAG =~ /^service-v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$/

stages:
  - infra
  - lint
  - bootstrap
  - build
  - docs
  - preview
  - release

# --- BASE TEMPLATES & ANCHORS ---

.resolve_component_version: &resolve_component_version
  - |
    if [ -n "${COMPONENT:-}" ]; then
      COMP_UPPER=$(echo "$COMPONENT" | tr '[:lower:]' '[:upper:]')
      VER_VAR="${COMP_UPPER}_NEXT_VERSION"
      TAG_VAR="${COMP_UPPER}_NEXT_TAG_NAME"
      NEXT_VERSION="${!VER_VAR:-${NEXT_VERSION:-}}"
      TAG_NAME="${!TAG_VAR:-${TAG_NAME:-}}"
      export NEXT_VERSION TAG_NAME
    fi

.bazel_cache:
  variables:
    BAZEL_CACHE_POLICY: "pull-push"
  cache:
    key:
      files:
        - MODULE.bazel.lock
      prefix: bazel-cache
    paths:
      - .bazel-cache/
      - .bazel-repo-cache/
    policy: $BAZEL_CACHE_POLICY

.core_changes: &core_changes
  - virtumic-core/**/*
  - "**/{BUILD,BUILD.bazel}"
  - "**/MODULE.bazel"
  - "ci/*.yml"
  - ".gitlab-ci.yml"

.service_changes: &service_changes
  - virtumic-service/**/*
  - virtumic-core/**/*  # Service depends on core
  - "**/{BUILD,BUILD.bazel}"
  - "**/MODULE.bazel"
  - "ci/*.yml"
  - ".gitlab-ci.yml"

.app_changes: &app_changes
  - virtumic-app/**/*
  - virtumic-service/**/*
  - virtumic-core/**/*
  - lib/privilege-hub/**/*
  - systemless-overlay-module/**/*
  - "**/{BUILD,BUILD.bazel}"
  - "**/MODULE.bazel"
  - "ci/*.yml"
  - ".gitlab-ci.yml"

.build_base:
  extends: .bazel_cache
  stage: build
  image: $CI_BASE_IMAGE
  variables:
    MISE_CONFIG_FILE: "ci/build-mise.toml"

.release_base:
  stage: release
  image: $CI_RELEASE_IMAGE
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    MISE_CONFIG_FILE: "ci/release-mise.toml"
  artifacts:
    name: "release-${COMPONENT}-${CI_COMMIT_REF_NAME}"
    paths:
      - dist/release_notes_*.md
    reports:
      dotenv: release.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false



.tag_push: &tag_push
  - |
    git config user.name "Release Bot"
    git config user.email "release-bot@${CI_SERVER_HOST}"
    git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    TAG_TITLE="VirtuMic ${COMPONENT^} ${NEXT_VERSION} | $(date +%Y-%m-%d)"
    git tag -a "$TAG_NAME" -m "$TAG_TITLE"
    git push origin "$TAG_NAME"

    LINKS_JSON="[]"
    if [ -f "dist/asset_links.json" ]; then
      LINKS_JSON=$(cat dist/asset_links.json)
    fi

    if [ -z "${DESCRIPTION:-}" ]; then
      NOTES_FILE="dist/release_notes_${COMPONENT}.md"
      if [ -f "$NOTES_FILE" ]; then
        DESCRIPTION=$(cat "$NOTES_FILE")
      else
        echo "ERROR: Release notes file $NOTES_FILE is missing! Cannot create release without notes." >&2
        exit 1
      fi
    fi

    PAYLOAD=$(jq -n \
      --arg name "$TAG_TITLE" \
      --arg tag_name "$TAG_NAME" \
      --arg description "$DESCRIPTION" \
      --argjson links "$LINKS_JSON" \
      '{name: $name, tag_name: $tag_name, description: $description, assets: {links: $links}}')

    curl --fail-with-body --silent --show-error \
      --request POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --header "Content-Type: application/json" \
      --data "$PAYLOAD"

build_library:core:
  extends: .build_base
  script:
    - eval "$(mise activate bash --quiet)"
    - bazel build --config=ci //virtumic-core:dist_flat
    - mkdir -p build/outputs
    - unzip bazel-bin/virtumic-core/dist_flat.zip -d build/outputs
  artifacts:
    paths:
      - build/outputs/
    expire_in: 1 week
  needs:
    - job: build_ci_base_image
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *core_changes

build_library:service:
  extends: .build_base
  script:
    - eval "$(mise activate bash --quiet)"
    - bazel build --config=ci //virtumic-service:dist_flat
    - mkdir -p build/outputs
    - unzip bazel-bin/virtumic-service/dist_flat.zip -d build/outputs
  artifacts:
    paths:
      - build/outputs/
    expire_in: 1 week
  needs:
    - job: build_ci_base_image
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *service_changes

build:app:
  extends: .build_base
  timeout: 90m
  tags:
    - saas-linux-medium-amd64
  variables:
    COMPONENT: "app"
  needs:
    - job: build_ci_base_image
      optional: true
    - job: bootstrap_metadata
      optional: true
      artifacts: true

  artifacts:
    paths:
      - dist/virtumic-full.apk
      - dist/virtumic-arm64.apk
      - dist/virtumic-x86_64.apk
      - dist/virtumic-privilege-extension.zip
      - dist/version_code.txt
  script:
    - eval "$(mise activate bash --quiet)"
    - mkdir -p dist
    - |
      if [ -f ./release.env ]; then
        . ./release.env
      fi
    - *resolve_component_version
    - export VERSION="${NEXT_VERSION}"
    - '[ -n "$VERSION" ] || { echo "ERROR: VERSION is empty for app!" >&2; exit 1; }'
    - UPDATE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/virtumic-app/latest/module_update.json"
    - bazel build --config=ci --define UPDATE_JSON_URL="$UPDATE_URL" //:overlay //:generate_version_code
    - cp bazel-bin/virtumic-privilege-extension.zip dist/virtumic-privilege-extension.zip
    - cp bazel-bin/version_code.txt dist/version_code.txt
    - bazel build --config=ci --android_platforms=//:arm64-v8a,//:x86_64 //virtumic-app:virtumic
    - cp bazel-bin/virtumic-app/virtumic.apk dist/virtumic-full.apk
    - bazel build --config=ci --android_platforms=//:arm64-v8a //virtumic-app:virtumic
    - cp bazel-bin/virtumic-app/virtumic.apk dist/virtumic-arm64.apk
    - bazel build --config=ci --android_platforms=//:x86_64 //virtumic-app:virtumic
    - cp bazel-bin/virtumic-app/virtumic.apk dist/virtumic-x86_64.apk
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *app_changes

build_docs:
  extends: .build_base
  stage: docs
  before_script:
    - eval "$(mise activate bash --quiet)"
  script:
    - bazel build --config=ci //virtumic-core:docs //virtumic-service:docs
    - mkdir -p build/docs/core build/docs/service
    - unzip -o bazel-bin/virtumic-core/virtumic-core-docs.zip -d build/docs/core
    - unzip -o bazel-bin/virtumic-service/virtumic-service-docs.zip -d build/docs/service
  artifacts:
    expose_as: 'API Documentation'
    paths:
      - build/docs/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

publish_internal:core:
  extends: .build_base
  stage: preview
  variables:
    MAVEN_REPO: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven"
    MAVEN_USER: "gitlab-ci-token"
    MAVEN_PASSWORD: "${CI_JOB_TOKEN}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *core_changes
  script:
    - eval "$(mise activate bash --quiet)"
    - bazel run --config=ci //virtumic-core:publish
  needs:
    - job: build_library:core

publish_internal:service:
  extends: .build_base
  stage: preview
  variables:
    MAVEN_REPO: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven"
    MAVEN_USER: "gitlab-ci-token"
    MAVEN_PASSWORD: "${CI_JOB_TOKEN}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *service_changes
  script:
    - eval "$(mise activate bash --quiet)"
    - bazel run --config=ci //virtumic-service:publish
  needs:
    - job: build_library:service

stage_maven:core:
  extends: .build_base
  stage: release
  variables:
    COMPONENT: "core"
    JRELEASER_STAGING_REPOSITORY: "build/staging-deploy-core"
  needs:
    - job: build_library:core
      artifacts: true
    - job: bootstrap_metadata
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - eval "$(mise activate bash --quiet)"
  script:
    - |
      if [ -f ./release.env ]; then
        . ./release.env
      fi
    - *resolve_component_version
    - export VERSION="$NEXT_VERSION"
    - '[ -n "$VERSION" ] || { echo "ERROR: VERSION is empty for core!" >&2; exit 1; }'
    - bazel build --config=ci "//virtumic-core:dist_maven"
    - rm -rf "${JRELEASER_STAGING_REPOSITORY}" && mkdir -p "${JRELEASER_STAGING_REPOSITORY}"
    - unzip -o "bazel-bin/virtumic-core/dist_maven.zip" -d "${JRELEASER_STAGING_REPOSITORY}"
  artifacts:
    name: "staging-core-${CI_COMMIT_REF_NAME}"
    paths:
      - build/staging-deploy-core
    expire_in: 1 day

stage_maven:service:
  extends: .build_base
  stage: release
  variables:
    COMPONENT: "service"
    JRELEASER_STAGING_REPOSITORY: "build/staging-deploy-service"
  needs:
    - job: build_library:service
      artifacts: true
    - job: bootstrap_metadata
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - eval "$(mise activate bash --quiet)"
  script:
    - |
      if [ -f ./release.env ]; then
        . ./release.env
      fi
    - *resolve_component_version
    - export VERSION="$NEXT_VERSION"
    - '[ -n "$VERSION" ] || { echo "ERROR: VERSION is empty for service!" >&2; exit 1; }'
    - bazel build --config=ci "//virtumic-service:dist_maven"
    - rm -rf "${JRELEASER_STAGING_REPOSITORY}" && mkdir -p "${JRELEASER_STAGING_REPOSITORY}"
    - unzip -o "bazel-bin/virtumic-service/dist_maven.zip" -d "${JRELEASER_STAGING_REPOSITORY}"
  artifacts:
    name: "staging-service-${CI_COMMIT_REF_NAME}"
    paths:
      - build/staging-deploy-service
    expire_in: 1 day

publish_maven:core:
  extends: .release_base
  stage: release
  resource_group: "release-core"
  variables:
    COMPONENT: "core"
    JRELEASER_STAGING_REPOSITORY: "build/staging-deploy-core"
    JRELEASER_GPG_PUBLIC_KEY: "$GPG_PUBLIC_KEY"
    JRELEASER_GPG_SECRET_KEY: "$GPG_SECRET_KEY"
    JRELEASER_GPG_PASSPHRASE: "$GPG_PASSPHRASE"
  needs:
    - job: stage_maven:core
      artifacts: true
    - job: bootstrap_metadata
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - eval "$(mise activate bash --quiet)"
  script:
    - |
      if [ -f ./release.env ]; then
        . ./release.env
      fi
    - *resolve_component_version
    - export JRELEASER_PROJECT_VERSION="$NEXT_VERSION"
    - export JRELEASER_MAVENCENTRAL_USERNAME="$JRELEASER_MAVENCENTRAL_USERNAME"
    - export JRELEASER_MAVENCENTRAL_PASSWORD="$JRELEASER_MAVENCENTRAL_PASSWORD"
    - export JRELEASER_NEXUS2_SONATYPE_SNAPSHOT_USERNAME="$JRELEASER_MAVENCENTRAL_USERNAME"
    - export JRELEASER_NEXUS2_SONATYPE_SNAPSHOT_PASSWORD="$JRELEASER_MAVENCENTRAL_PASSWORD"
    - export JRELEASER_MAVENCENTRAL_STAGE="UPLOAD"
    - export JRELEASER_GPG_PUBLIC_KEY=$(echo "$JRELEASER_GPG_PUBLIC_KEY" | base64 -d)
    - export JRELEASER_GPG_SECRET_KEY=$(echo "$JRELEASER_GPG_SECRET_KEY" | base64 -d)
    - jreleaser deploy --config-file ci/jreleaser.yml
    - *tag_push

publish_maven:service:
  extends: .release_base
  stage: release
  resource_group: "release-service"
  variables:
    COMPONENT: "service"
    JRELEASER_STAGING_REPOSITORY: "build/staging-deploy-service"
    JRELEASER_GPG_PUBLIC_KEY: "$GPG_PUBLIC_KEY"
    JRELEASER_GPG_SECRET_KEY: "$GPG_SECRET_KEY"
    JRELEASER_GPG_PASSPHRASE: "$GPG_PASSPHRASE"
  needs:
    - job: stage_maven:service
      artifacts: true
    - job: bootstrap_metadata
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - eval "$(mise activate bash --quiet)"
  script:
    - |
      if [ -f ./release.env ]; then
        . ./release.env
      fi
    - *resolve_component_version
    - export JRELEASER_PROJECT_VERSION="$NEXT_VERSION"
    - export JRELEASER_MAVENCENTRAL_USERNAME="$JRELEASER_MAVENCENTRAL_USERNAME"
    - export JRELEASER_MAVENCENTRAL_PASSWORD="$JRELEASER_MAVENCENTRAL_PASSWORD"
    - export JRELEASER_NEXUS2_SONATYPE_SNAPSHOT_USERNAME="$JRELEASER_MAVENCENTRAL_USERNAME"
    - export JRELEASER_NEXUS2_SONATYPE_SNAPSHOT_PASSWORD="$JRELEASER_MAVENCENTRAL_PASSWORD"
    - export JRELEASER_MAVENCENTRAL_STAGE="UPLOAD"
    - export JRELEASER_GPG_PUBLIC_KEY=$(echo "$JRELEASER_GPG_PUBLIC_KEY" | base64 -d)
    - export JRELEASER_GPG_SECRET_KEY=$(echo "$JRELEASER_GPG_SECRET_KEY" | base64 -d)
    - jreleaser deploy --config-file ci/jreleaser.yml
    - *tag_push

# --- RELEASE JOBS ---

.preview_component_base:
  extends: .release_base
  stage: preview
  needs: []
  cache: []
  script:
    - eval "$(mise activate bash --quiet)"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git config user.name "Release Bot"
        git config user.email "release-bot@gitlab.com"
        FEATURE_COMMIT=$(git rev-parse HEAD)
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git reset --hard "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git merge --allow-unrelated-histories --squash "$FEATURE_COMMIT"
        git commit -m "$CI_MERGE_REQUEST_TITLE"
      fi
    - !reference [.cliff_resolve, script]
    - 'echo "Preview: Next tag for virtumic-$COMPONENT is $TAG_NAME (version $NEXT_VERSION)"'
    - echo "--- Changelog Preview ---"
    - printf '%s\n' "$DESCRIPTION"
    - echo "--- Changelog Preview End ---"


.release_maven_base:
  extends: .release_base
  resource_group: "release-$COMPONENT"
  script:
    - eval "$(mise activate bash --quiet)"
    - echo "Releasing $TAG_NAME..."

    # Build Bazel Maven distribution zip
    - export VERSION="$NEXT_VERSION"
    - bazel build --config=ci "//virtumic-${COMPONENT}:dist_maven"

    # Unpack isolated staging deploy for JReleaser (collision-proof)
    - export JRELEASER_STAGING_REPOSITORY="build/staging-deploy-${COMPONENT}"
    - rm -rf "${JRELEASER_STAGING_REPOSITORY}" && mkdir -p "${JRELEASER_STAGING_REPOSITORY}"
    - unzip -q -o "bazel-bin/virtumic-${COMPONENT}/dist_maven.zip" -d "${JRELEASER_STAGING_REPOSITORY}"

    # Publish internally to GitLab Package Registry
    - export MAVEN_REPO="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven"
    - export MAVEN_USER="gitlab-ci-token"
    - export MAVEN_PASSWORD="${CI_JOB_TOKEN}"
    - bazel run --config=ci "//virtumic-${COMPONENT}:publish"

    # Deploy to Maven Central via JReleaser
    - export JRELEASER_PROJECT_VERSION="$NEXT_VERSION"
    - export JRELEASER_MAVENCENTRAL_USERNAME="$JRELEASER_MAVENCENTRAL_USERNAME"
    - export JRELEASER_MAVENCENTRAL_PASSWORD="$JRELEASER_MAVENCENTRAL_PASSWORD"
    - export JRELEASER_NEXUS2_SONATYPE_SNAPSHOT_USERNAME="$JRELEASER_MAVENCENTRAL_USERNAME"
    - export JRELEASER_NEXUS2_SONATYPE_SNAPSHOT_PASSWORD="$JRELEASER_MAVENCENTRAL_PASSWORD"
    - |
      if [ -n "${GPG_PUBLIC_KEY:-}" ]; then
        export JRELEASER_GPG_PUBLIC_KEY=$(echo "$GPG_PUBLIC_KEY" | base64 -d)
      fi
      if [ -n "${GPG_SECRET_KEY:-}" ]; then
        export JRELEASER_GPG_SECRET_KEY=$(echo "$GPG_SECRET_KEY" | base64 -d)
      fi
    - export JRELEASER_GPG_PASSPHRASE="$GPG_PASSPHRASE"
    - export JRELEASER_MAVENCENTRAL_STAGE="UPLOAD"
    - jreleaser deploy --config-file ci/jreleaser.yml
    - |
      MAVEN_CENTRAL_BASE_URL="https://central.sonatype.com/artifact/com.indidevs.android.virtumic/virtumic-${COMPONENT}"
      MAVEN_CENTRAL_URL="${MAVEN_CENTRAL_BASE_URL}/${NEXT_VERSION}"

      jq -n --arg name "Maven Central Artifact" --arg url "$MAVEN_CENTRAL_URL" --arg link_type "package" \
        '[{name: $name, url: $url, link_type: $link_type}]' > dist/asset_links.json

      SAFE_VERSION="${NEXT_VERSION//-/--}"
      BADGE_HEADER="[![Release](https://img.shields.io/badge/Release-v${SAFE_VERSION}-blue)](${MAVEN_CENTRAL_URL}) [![Latest](https://img.shields.io/maven-central/v/com.indidevs.android.virtumic/virtumic-${COMPONENT}?label=Latest)](${MAVEN_CENTRAL_BASE_URL})"
      BADGE_HEADER="${BADGE_HEADER}"$'\n\n'"[View Version ${NEXT_VERSION} on Maven Central](${MAVEN_CENTRAL_URL})"$'\n\n'

      NOTES_FILE="dist/release_notes_${COMPONENT}.md"
      if [ -f "$NOTES_FILE" ]; then
        ORIG_NOTES=$(cat "$NOTES_FILE")
        printf '%s%s\n' "$BADGE_HEADER" "$ORIG_NOTES" > "$NOTES_FILE"
      fi

    - *tag_push

release:app:
  extends: .release_base
  resource_group: "release-app"
  variables:
    COMPONENT: "app"
  needs:
    - job: bootstrap_metadata
      artifacts: true
    - job: sign:app
      artifacts: true
  script:
    - eval "$(mise activate bash --quiet)"
    - |
      echo "Releasing $TAG_NAME to GitLab Package Registry & Release..."

      PKG_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/virtumic-app/${NEXT_VERSION}"
      LATEST_PKG_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/virtumic-app/latest"
      ASSET_LINKS_JSON="[]"

      APKS="dist/virtumic-full.apk dist/virtumic-arm64.apk dist/virtumic-x86_64.apk dist/virtumic-privilege-extension.zip"

      for APK in $APKS; do
        BASENAME=$(basename "$APK")
        PKG_URL="${PKG_BASE_URL}/${BASENAME}"

        curl --fail --silent --show-error --retry 3 --retry-all-errors \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$APK" \
          "$PKG_URL"

        LINK_OBJ=$(jq -n --arg name "$BASENAME" --arg url "$PKG_URL" --arg link_type "package" '{name: $name, url: $url, link_type: $link_type}')
        ASSET_LINKS_JSON=$(echo "$ASSET_LINKS_JSON" | jq --argjson link "$LINK_OBJ" '. + [$link]')
      done

      for EXTRA in checksums.txt checksums.txt.asc checksums.txt.bundle module_update.json; do
        if [ -f "dist/$EXTRA" ]; then
          EXTRA_URL="${PKG_BASE_URL}/${EXTRA}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "dist/$EXTRA" \
            "$EXTRA_URL"

          LINK_OBJ=$(jq -n --arg name "$EXTRA" --arg url "$EXTRA_URL" --arg link_type "other" '{name: $name, url: $url, link_type: $link_type}')
          ASSET_LINKS_JSON=$(echo "$ASSET_LINKS_JSON" | jq --argjson link "$LINK_OBJ" '. + [$link]')
        fi
      done

      # Upload systemless assets to /latest/ package endpoint
      for LATEST_ASSET in module_update.json virtumic-privilege-extension.zip; do
        if [ -f "dist/$LATEST_ASSET" ]; then
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "dist/$LATEST_ASSET" \
            "${LATEST_PKG_BASE_URL}/$LATEST_ASSET"
        fi
      done

      echo "$ASSET_LINKS_JSON" > dist/asset_links.json

    - *tag_push

preview:core:
  extends: .preview_component_base
  variables:
    COMPONENT: "core"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *core_changes
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

preview:service:
  extends: .preview_component_base
  variables:
    COMPONENT: "service"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *service_changes
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

preview:app:
  extends: .preview_component_base
  variables:
    COMPONENT: "app"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *app_changes
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# --- RELEASE JOBS ---

release:core:
  extends: .release_maven_base
  variables:
    COMPONENT: "core"
  needs:
    - job: bootstrap_metadata
      artifacts: true
    - job: build_library:core
      artifacts: true

release:service:
  extends: .release_maven_base
  variables:
    COMPONENT: "service"
  needs:
    - job: bootstrap_metadata
      artifacts: true
    - job: build_library:service
      artifacts: true

.release_github_base:
  extends: .release_base
  script:
    - eval "$(mise activate bash --quiet)"
    - |
      if [ -z "${GH_TOKEN:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
        echo "ERROR: GH_TOKEN or GITHUB_REPOSITORY variable is missing!"
        exit 1
      fi

      echo "Publishing Draft Release for $TAG_NAME to GitHub (${GITHUB_REPOSITORY})..."

      mkdir -p dist

      # Collect available dist assets to upload
      FILES_TO_UPLOAD=""
      ASSETS="dist/virtumic-full.apk dist/virtumic-arm64.apk dist/virtumic-x86_64.apk dist/virtumic-privilege-extension.zip dist/checksums.txt dist/checksums.txt.asc dist/checksums.txt.bundle dist/module_update.json"

      for FILE in $ASSETS; do
        if [ -f "$FILE" ]; then
          FILES_TO_UPLOAD="$FILES_TO_UPLOAD $FILE"
        fi
      done

      TAG_TITLE="VirtuMic ${COMPONENT^} ${NEXT_VERSION} | $(date +%Y-%m-%d)"

      NOTES_FILE="dist/release_notes_${COMPONENT}.md"
      [ -f "$NOTES_FILE" ] || NOTES_FILE="dist/release_notes.md"

      GH_TOKEN="${GH_TOKEN}" gh release create "$TAG_NAME" \
        $FILES_TO_UPLOAD \
        --draft \
        --title "$TAG_TITLE" \
        --notes-file "$NOTES_FILE" \
        --repo "${GITHUB_REPOSITORY}"

      echo "Successfully published draft release $TAG_NAME to GitHub (${GITHUB_REPOSITORY})!"

release:github:app:
  extends: .release_github_base
  variables:
    COMPONENT: "app"
  needs:
    - job: bootstrap_metadata
      artifacts: true
    - job: sign:app
      artifacts: true

release:github:core:
  extends: .release_github_base
  variables:
    COMPONENT: "core"
  needs:
    - job: bootstrap_metadata
      artifacts: true
    - job: build_library:core
      artifacts: true

release:github:service:
  extends: .release_github_base
  variables:
    COMPONENT: "service"
  needs:
    - job: bootstrap_metadata
      artifacts: true
    - job: build_library:service
      artifacts: true
